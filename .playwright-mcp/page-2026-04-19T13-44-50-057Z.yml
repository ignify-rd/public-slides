      - generic [ref=e107]:
        - paragraph [ref=e108]: "Cách Data Fabric xử lý sai lệch:"
        - list [ref=e109]:
          - listitem [ref=e110]: "Phân tích Metadata (Lineage): Nó kiểm tra xem dữ liệu này đến từ đâu. Hệ thống SQL chính thức thường được máy chấm điểm tin cậy cao hơn một tệp Excel nhập tay."
          - listitem [ref=e111]: "Áp dụng Quy tắc kinh doanh (Business Rules): Bạn có thể cài đặt: \"Nếu có sai lệch về lương, luôn ưu tiên dữ liệu từ hệ thống Kế toán\"."
          - listitem [ref=e112]: "Học máy (AI/ML): AI quan sát lịch sử chỉnh sửa. Nếu nó thấy tệp Excel thường xuyên bị sai và đã được sửa lại nhiều lần, nó sẽ tự động cảnh báo đây là nguồn dữ liệu \"kém chất lượng\"."
        - paragraph [ref=e113]
