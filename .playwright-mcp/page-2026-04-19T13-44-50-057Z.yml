        - paragraph [ref=e126]: "Kịch bản: Phòng Sales lưu lương trong SQL Server (cột base_pay), phòng Tech lưu trong file Excel trên SharePoint (cột Salary_USD), phòng Marketing dùng phần mềm SaaS (cột Income)."
        - paragraph [ref=e127]: "Bước 1 (Ảo hóa): Bạn không cần tải dữ liệu về máy. Data Fabric tạo ra các \"pipelines\" kết nối trực tiếp đến 3 nguồn này."
