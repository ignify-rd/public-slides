    - region "Folie 4" [ref=e22]:
      - paragraph [ref=e24]: Tại sao cần Data Fabric?
      - generic [ref=e25]:
        - paragraph [ref=e26]: "Dữ liệu của bạn nằm rải rác khắp nơi:"
        - list [ref=e27]:
          - listitem [ref=e28]: ● trong file Excel
          - listitem [ref=e29]: ● trên cloud
          - listitem [ref=e30]: ● trong cơ sở dữ liệu cũ
          - listitem [ref=e31]: ● ở các phòng ban khác nhau
        - paragraph [ref=e32]: Thường thì rất lộn xộn.
        - paragraph [ref=e33]: Mọi người mất thời gian tìm dữ liệu đúng, sao chép qua lại, và sửa chỗ lệch nhau.
        - paragraph [ref=e34]: Data fabric giống như một smart layer phủ lên các hệ thống đó.�Nó giúp kết nối, sắp xếp, và làm dữ liệu dễ tìm, dễ dùng hơn.
        - paragraph [ref=e35]
  - group "Folie 5" [ref=e36]:
    - heading "5 von 24" [level=1] [ref=e37]
    - region "Folie 5" [ref=e38]:
      - paragraph [ref=e40]: Khó khăn chung của việc quản lý dữ liệu
      - generic [ref=e41]:
        - paragraph [ref=e42]: "Sự cô lập dữ liệu (Data Silos): Dữ liệu nằm rải rác ở nhiều phòng ban, ứng dụng khác nhau và không \"nói chuyện\" được với nhau."
        - paragraph [ref=e43]: "Môi trường phức tạp (Hybrid & Multi-cloud): Dữ liệu vừa ở dưới server công ty (On-premise), vừa ở trên nhiều nền tảng mây (AWS, Azure, Google Cloud), gây khó khăn khi muốn tổng hợp."
        - paragraph [ref=e44]: "Quy trình thủ công & Chậm trễ: Việc lấy dữ liệu mất vài tuần vì phải chờ IT viết code, chạy ETL (chiết xuất, biến đổi, nạp) thủ công."
        - paragraph [ref=e45]: "Dữ liệu \"tối\" (Dark Data): Doanh nghiệp có rất nhiều dữ liệu nhưng không biết mình đang có gì, dữ liệu đó có đáng tin hay không (thiếu Metadata)."
        - paragraph [ref=e46]: "Rủi ro bảo mật: Càng nhiều nguồn dữ liệu thì càng khó kiểm soát ai đang xem cái gì, dễ vi phạm quy định pháp luật (như GDPR)."
        - paragraph [ref=e47]
